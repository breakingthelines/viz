name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # @breakingthelines/protos (devDependency) is on GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GH_PKG_TOKEN || github.token }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build Storybook
        run: bun run build-storybook
